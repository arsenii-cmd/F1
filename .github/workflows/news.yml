name: Refresh F1 headlines
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: f1-news-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch publisher RSS headlines
        run: python scripts/refresh_news.py
      - name: Save the refreshed feed
        env:
          NEWS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet -- data/news.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/news.json
            git commit -m 'Refresh F1 news headlines'
            git push
            # GITHUB_TOKEN pushes don't automatically rebuild branch-based Pages.
            curl --fail --silent --show-error --output /tmp/news-pages-build.json \
              --request POST --header "Authorization: Bearer $NEWS_GITHUB_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              '${{ github.api_url }}/repos/${{ github.repository }}/pages/builds'
          fi
